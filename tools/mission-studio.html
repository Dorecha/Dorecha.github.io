<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Studio</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#18181b;--line:#3f3f46;--accent:#f97316;--muted:#a1a1aa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f5;font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{background:#27272a;color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}button.primary{background:var(--accent);border-color:#fb923c}button.active{outline:2px solid var(--accent)}button.danger{color:#fca5a5}header{padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#111114;z-index:5}.top{max-width:1500px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{margin:0 0 4px;font-size:22px}.small{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:370px 1fr;gap:18px;padding:18px;max-width:1500px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.field{margin-bottom:11px}.field label{display:block;color:#d4d4d8;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#09090b;color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}.field textarea{min-height:78px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.mission-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:10px 0 14px}.mission-item{padding:9px 10px;border-bottom:1px solid #27272a;cursor:pointer}.mission-item:last-child{border:0}.mission-item:hover{background:#27272a}.mission-item.active{background:#3f3f46}.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.canvas-wrap{background:#09090b;border:1px solid var(--line);border-radius:10px;padding:12px}.canvas{width:100%;aspect-ratio:300/220;display:block;touch-action:none}.status{min-height:22px;color:#a7f3d0;margin-top:9px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.templates{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.templates button{font-size:12px}.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-top:8px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.blue{background:#2563eb}.red{background:#dc2626}.amber{background:#f59e0b}@media(max-width:1000px){.layout{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header><div class="top"><div><h1>MISSION STUDIO</h1><div class="small">Добавление, копирование, удаление миссий и визуальное создание карт.</div></div><div class="row" style="max-width:360px"><button id="langRu" class="active">RU</button><button id="langEn">EN</button><button id="reload">Обновить</button></div></div></header>
<main class="layout">
<section class="panel">
  <div class="actions"><button id="newBtn" class="primary">Новая</button><button id="duplicateBtn">Дублировать</button><button id="deleteBtn" class="danger">Удалить</button><button id="saveBtn" class="primary">Сохранить всё</button></div>
  <div class="field"><label>Выбрать миссию</label><select id="missionSelect"></select></div>
  <div id="missionList" class="mission-list"></div>
  <div class="field"><label>ID</label><input id="id"></div>
  <div class="row"><div class="field"><label>Категория</label><select id="category"><option value="basic">basic</option><option value="advanced">advanced</option></select></div><div class="field"><label>Тип расстановки</label><input id="type"></div></div>
  <div class="field"><label>Заголовок</label><input id="title"></div>
  <div class="field"><label>Подзаголовок</label><input id="subtitle"></div>
  <div class="field"><label>Название категории</label><input id="categoryName"></div>
  <div class="field"><label>Deployment</label><textarea id="deployment"></textarea></div>
  <div class="field"><label>Scoring</label><textarea id="scoring"></textarea></div>
  <div class="field"><label>Mechanics</label><textarea id="mechanics"></textarea></div>
  <div class="field"><label>Темп игры</label><textarea id="pace"></textarea></div>
  <div id="editorTitle" class="small"></div><div id="status" class="status"></div>
</section>
<section class="panel">
  <div class="section-title"><div><h2 style="margin:0">Map Designer</h2><div id="mapLabel" class="small">Карта</div></div><div class="small">300 × 220</div></div>
  <div class="templates"><span class="small">Шаблон:</span><button data-template="standard">Стандарт</button><button data-template="front">Короткие края</button><button data-template="diagonal">Диагональ</button><button data-template="center">Центр</button><button id="clearMap" class="danger">Очистить</button></div>
  <div class="toolbar"><button data-tool="select" class="active">Выбор</button><button data-tool="rectA">Зона A</button><button data-tool="rectB">Зона B</button><button data-tool="polygonA">Полигон A</button><button data-tool="polygonB">Полигон B</button><button data-tool="objective">VP</button><button data-tool="obstacle">Террейн</button><button data-tool="line">Линия</button><button data-tool="label">Текст</button><button id="finishPolygon">Завершить полигон</button><button id="delete">Удалить выбранное</button></div>
  <div class="canvas-wrap"><svg id="canvas" class="canvas" viewBox="0 0 300 220"></svg></div>
  <div class="legend"><span><i class="dot blue"></i> Игрок A</span><span><i class="dot red"></i> Игрок B</span><span><i class="dot amber"></i> VP / линия</span></div>
  <div class="small" style="margin-top:10px">Прямоугольники и линии рисуются перетаскиванием. Полигоны — кликами по вершинам. Текст и террейн запрашивают подпись.</div>
</section>
</main>
<script src="/tools/mission-studio-v2.js"></script>
</body>
</html>
