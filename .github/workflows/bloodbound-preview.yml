name: BLOODBOUND Pages
on:
  push:
    branches:
      - agent/mission-studio-v2
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bloodbound-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Patch BLOODBOUND mobile menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bloodbound/index.html')
          s = p.read_text(encoding='utf-8')
          old = "p.on('pointerdown',()=>this.start())"
          if old not in s:
              raise SystemExit('BLOODBOUND menu handler signature not found')
          s = s.replace(old, "window.__bbStart=()=>this.start();p.on('pointerdown',()=>this.start())", 1)
          marker = '<div id="g"></div>'
          overlay = '''<div id="bb-touch-play" style="position:fixed;left:50%;top:54%;transform:translate(-50%,-50%);z-index:99999;padding:14px 30px;border:2px solid #b5363b;background:#202936;color:#ddd7ca;font:700 30px monospace;letter-spacing:2px;border-radius:4px;touch-action:manipulation;user-select:none;-webkit-user-select:none">[ PLAY ]</div><script>(function(){const b=document.getElementById('bb-touch-play');const sync=()=>{b.style.display=window.__bbStart?'block':'none'};const go=e=>{e.preventDefault();e.stopPropagation();if(window.__bbStart){window.__bbStart();b.style.display='none'}};b.addEventListener('pointerdown',go,{passive:false});b.addEventListener('touchstart',go,{passive:false});setInterval(sync,100);sync()})();</script>'''
          if marker not in s:
              raise SystemExit('BLOODBOUND mount marker not found')
          s = s.replace(marker, marker + overlay, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate generated page
        run: |
          test -s bloodbound/index.html
          grep -q '__bbStart' bloodbound/index.html
          grep -q 'bb-touch-play' bloodbound/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
