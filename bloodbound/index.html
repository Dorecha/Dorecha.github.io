class ParticleManager{constructor(scene){this.scene=scene;this.particles=[]}burst(x,y,type,count=10,opts={}){const colors={BLOOD:[PAL.blood2,PAL.red2,PAL.red3],SPARK:[PAL.white,PAL.gold,PAL.metal2],DUST:[PAL.stone2,PAL.stone3,PAL.metalDark],DEBRIS:[PAL.stone,PAL.stone2,PAL.stone3],IMPACT:[PAL.white,PAL.red3,PAL.gold],DEATH:[PAL.blood,PAL.blood2,PAL.red2]},list=colors[type]||colors.DUST;count=Math.min(count,opts.max||50);for(let i=0;i<count;i++){const g=this.scene.add.rectangle(x,y,opts.size||Phaser.Math.Between(3,7),opts.size||Phaser.Math.Between(3,7),Phaser.Display.Color.HexStringToColor(Phaser.Utils.Array.GetRandom(list)).color);g.setDepth(opts.depth??30);const a=Phaser.Math.FloatBetween(0,Math.PI*2),s=Phaser.Math.Between(opts.speedMin||40,opts.speedMax||260),p={g,vx:Math.cos(a)*s+(opts.vx||0),vy:Math.sin(a)*s+(opts.vy||0),life:Phaser.Math.Between(opts.lifeMin||180,opts.lifeMax||430),max:0,grav:opts.gravity??(type==='SPARK'?500:800)};p.max=p.life;this.particles.push(p)}}trail(x,y){const g=this.scene.add.rectangle(x+Phaser.Math.Between(-5,5),y+Phaser.Math.Between(-7,7),Phaser.Math.Between(4,8),Phaser.Math.Between(7,13),Phaser.Display.Color.HexStringToColor(Phaser.Utils.Array.GetRandom([PAL.red,PAL.red2,PAL.red3])).color,.55);g.setDepth(25);this.particles.push({g,vx:Phaser.Math.Between(-20,20),vy:Phaser.Math.Between(-20,20),life:150,max:150,grav:0})}update(dt){for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.life-=dt;if(p.life<=0){p.g.destroy();this.particles.splice(i,1);continue}p.vy+=p.grav*dt/1000;p.g.x+=p.vx*dt/1000;p.g.y+=p.vy*dt/1000;p.g.alpha=clamp(p.life/p.max,0,1)}}clear(){this.particles.forEach(p=>p.g.destroy());this.particles=[]}}
class JuiceManager{constructor(scene){this.scene=scene;this.shake=0;this.shakeTime=0;this.shakeDuration=0;this.hitstop=0}shakeCamera(intensity,duration){this.shake=Math.max(this.shake,intensity);this.shakeTime=Math.max(this.shakeTime,duration);this.shakeDuration=Math.max(this.shakeDuration,duration)}hitStop(ms){this.hitstop=Math.max(this.hitstop,ms)}flash(color=0xffffff,alpha=.18,duration=70){const r=this.scene.add.rectangle(W/2,H/2,W,H,color,alpha).setScrollFactor(0).setDepth(1000);this.scene.tweens.add({targets:r,alpha:0,duration,onComplete:()=>r.destroy()})}update(dt){if(this.hitstop>0){this.hitstop-=dt;return true}if(this.shakeTime>0){this.shakeTime-=dt;const amp=this.shake*Math.max(0,this.shakeTime/Math.max(1,this.shakeDuration));this.scene.cameras.main.setScroll(Math.round(Phaser.Math.FloatBetween(-amp,amp)*W),Math.round(Phaser.Math.FloatBetween(-amp,amp)*H));if(this.shakeTime<=0)this.scene.cameras.main.setScroll(0,0)}return false}}
class InputManager{constructor(scene){this.scene=scene;this.keys={};this.just={};this.touch={left:false,right:false,up:false,down:false,attack:false,parry:false,dash:false,jump:false};this.joy={active:false,id:null,x:0,y:0,baseX:115,baseY:H-110,knobX:115,knobY:H-110,radius:70};this.buttons={};this.setupKeyboard();this.setupTouch()}setupKeyboard(){const k=this.scene.input.keyboard;['A','D','W','S','LEFT','RIGHT','UP','DOWN','SPACE','J','K','L','ESC','R','F3'].forEach(n=>this.keys[n]=k.addKey(Phaser.Input.Keyboard.KeyCodes[n]))}setupTouch(){this.scene.input.addPointer(4);this.scene.input.on('pointerdown',p=>this.pointerDown(p));this.scene.input.on('pointermove',p=>this.pointerMove(p));this.scene.input.on('pointerup',p=>this.pointerUp(p));this.scene.input.on('pointerupoutside',p=>this.pointerUp(p))}pointerDown(p){if(!this.scene.mobile)return;const{x,y}=p;if(x<W*.42&&y>H*.48){if(!this.joy.active){this.joy.active=true;this.joy.id=p.id;this.joy.baseX=x;this.joy.baseY=y;this.joy.knobX=x;this.joy.knobY=y;this.joy.x=0;this.joy.y=0}return}const b=this.buttonAt(x,y);if(b){this.touch[b]=true;this.just[b]=true;this.buttons[b].pressed=true;this.scene.soundSystem.click()}}pointerMove(p){if(!this.scene.mobile||!this.joy.active||p.id!==this.joy.id)return;const dx=p.x-this.joy.baseX,dy=p.y-this.joy.baseY,len=Math.hypot(dx,dy),r=this.joy.radius,m=Math.min(1,len/r);this.joy.x=(len?dx/len:0)*m;this.joy.y=(len?dy/len:0)*m;this.joy.knobX=this.joy.baseX+this.joy.x*r;this.joy.knobY=this.joy.baseY+this.joy.y*r}pointerUp(p){if(!this.scene.mobile)return;if(this.joy.active&&p.id===this.joy.id){this.joy.active=false;this.joy.x=0;this.joy.y=0;return}const b=this.buttonAt(p.x,p.y);if(b){this.touch[b]=false;this.buttons[b].pressed=false}}buttonAt(x,y){for(const n of Object.keys(this.buttons)){const b=this.buttons[n];if(Math.hypot(x-b.x,y-b.y)<b.r*1.15)return n}return null}addButton(name,x,y,r,label){this.buttons[name]={x,y,r,label,pressed:false}}configureTouch(){this.buttons={};const s=Math.min(W/1 class Player extends Phaser.Physics.Arcade.Sprite{constructor(s,x,y){super(s,x,y,'player');s.add.existing(this);s.physics.add.existing(this);this.setDepth(20);this.setCollideWorldBounds(false);this.body.setSize(24,46).setOffset(7,8);this.speed=280;this.jumpSpeed=520;this.maxHp=5;this.hp=5;this.facing=1;this.state='IDLE';this.coyote=0;this.jumpBuffer=0;this.dashAvailable=true;this.dashTimer=0;this.attackTimer=0;this.parryTimer=0;this.hurtTimer=0;this.gravefall=false;this.lastGround=false}update(dt){const im=this.scene.inputManager,grounded=this.body.blocked.down;this.coyote=grounded?110:Math.max(0,this.coyote-dt);this.jumpBuffer=im.pressed('jump')?120:Math.max(0,this.jumpBuffer-dt);if(this.hurtTimer>0){this.hurtTimer-=dt;if(this.hurtTimer<=0)this.state='FALL';return}if(this.state==='DEAD')return;const left=im.isDown('left'),right=im.isDown('right');let dir=left?-1:right?1:0;if(dir){this.facing=dir;this.setVelocityX(dir*this.speed)}else this.setVelocityX(this.body.velocity.x*.78);if(this.jumpBuffer>0&&this.coyote>0){this.setVelocityY(-this.jumpSpeed);this.jumpBuffer=0;this.coyote=0;this.scene.soundSystem.jump();this.scene.particles.burst(this.x,this.y+25,'DUST',7)}if(im.pressed('dash')&&this.dashAvailable)this.dash();if(im.pressed('parry'))this.parry();if(im.pressed('attack'))this.attack();if(im.isDown('down')&&im.isDown('attack')&&!grounded)this.gravefallAttack();if(this.dashTimer>0){this.dashTimer-=dt;this.scene.particles.trail(this.x,this.y);if(this.dashTimer<=0){this.body.allowGravity=true;this.setVelocityX(this.facing*130);this.alpha=1}}if(this.attackTimer>0)this.attackTimer-=dt;if(this.parryTimer>0)this.parryTimer-=dt;if(!grounded&&this.body.blocked.left||!grounded&&this.body.blocked.right){if(this.body.velocity.y>0)this.body.setVelocityY(Math.min(this.body.velocity.y,150));this.state='WALL_SLIDE'}else if(this.attackTimer>0)this.state='ATTACK';else if(this.parryTimer>0)this.state='PARRY';else if(this.dashTimer>0)this.state='DASH';else if(!grounded&&this.body.vel class Enemy extends Phaser.Physics.Arcade.Sprite{constructor(s,x,y,key,hp=2){super(s,x,y,key);s.add.existing(this);s.physics.add.existing(this);this.setDepth(18);this.hp=hp;this.maxHp=hp;this.dead=false;this.speed=90;this.attackCd=0;this.facing=-1;this.body.setSize(this.width*.62,this.height*.8).setOffset(this.width*.19,this.height*.12);s.spawnEnemy(this)}update(dt){if(this.dead)return;const p=this.scene.player;if(!p)return;this.attackCd=Math.max(0,this.attackCd-dt);const dx=p.x-this.x,dy=p.y-this.y;if(Math.abs(dx)<500&&Math.abs(dy)<140){this.facing=sign(dx);this.setVelocityX(this.facing*this.speed);if(Math.abs(dx)<55&&this.attackCd<=0){this.attackCd=850;p.takeDamage(1,this,{x:this.facing*260,y:-250})}}else this.setVelocityX(0)}takeDamage(n,source,knock={x:0,y:-160}){if(this.dead)return;this.hp-=n;this.setVelocity(knock.x,knock.y);this.scene.particles.burst(this.x,this.y,'IMPACT',10);this.scene.juice.hitStop(55);this.scene.soundSystem.hit();if(this.hp<=0)this.die()}die(){this.dead=true;this.body.enable=false;this.scene.combo.addKill();this.scene.particles.burst(this.x,this.y,'DEATH',20);this.scene.tweens.add({targets:this,alpha:0,y:this.y-20,duration:240,onComplete:()=>this.destroy()})}}

class ProjectileManager{constructor(s){this.scene=s;this.items=[]}fire(x,y,tx,ty,owner,reflected=false){const p=this.scene.physics.add.image(x,y,'projectile');p.setDepth(17);p.owner=owner;p.reflected=reflected;const a=Math.atan2(ty-y,tx-x);p.setVelocity(Math.cos(a)*420,Math.sin(a)*420);p.life=2600;this.items.push(p);return p}reflect(p){if(!p||!p.active)return;p.reflected=true;p.owner=this.scene.player;p.setVelocityX(-p.body.velocity.x*1.35);p.setVelocityY(p.body.velocity.y);p.setTint(0xd94a4d);this.scene.particles.burst(p.x,p.y,'SPARK',12);this.scene.juice.hitStop(65)}update(dt){for(let i=this.items.length-1;i>=0;i--){const p=this.items[i];if(!p.active){this.items.splice(i,1);continue}p.life-=dt;if(p.life<=0){p.destroy();this.items.splice(i,1);continue}if(p.reflected){for(const e of this.scene.enemies){if(!e.dead&&Phaser.Geom.Intersects.RectangleToRectangle(p.getBounds(),e.getBounds())){e.takeDamage(2,this.scene.player,{x:p.body.velocity.x*.35,y:-180});p.destroy();this.items.splice(i,1);break}}}else{const pl=this.scene.player;if(pl&&pl.state!=='DEAD'&&Phaser.Geom.Intersects.RectangleToRectangle(p.getBounds(),pl.getBounds())){if(pl.parryTimer>0)this.reflect(p);else{pl.takeDamage(1,p,{x:sign(p.body.velocity.x)*220,y:-180});p.destroy();this.items.splice(i,1)}}}}}clear(){this.items.forEach(p=>p.destroy());this.items=[]}}
class BreakableTile{constructor(s,x,y,w=64,h=32){this.scene=s;this.hp=2;this.sprite=s.physics.add.image(x,y,'tile').setImmovable(true);this.sprite.body.allowGravity=false;this.sprite.setDisplaySize(w,h);this.sprite.breakable=this;s.breakables.push(this)}hit(n=1){this.hp-=n;this.sprite.setAlpha(Math.max(.25,this.hp/2));this.scene.particles.burst(this.sprite.x,this.sprite.y,'DEBRIS',8);if(this.hp<=0)this.destroy()}destroy(){this.scene.juice.shakeCamera(.008,130);this.scene.particles.burst(this.sprite.x,this.sprite.y,'DEBRIS',20);this.sprite.destroy()}}
class CombatSystem{constructor(s){this.scene=s}playerUpdate(p){}swing(p){const reach=65,box=new Phaser.Geom.Rectangle(p.x+(p.facing>0?0:-reach),p.y-30,reach,60);for(const e of this.scene.enemies){if(!e.dead&&Phaser.Geom.Intersects.RectangleToRectangle(box,e.getBounds()))e.takeDamage(2,p,{x:p.facing*300,y:-230})}for(const q of this.scene.projectiles.items){if(q.active&&Phaser.Geom.Intersects.RectangleToRectangle(box,q.getBounds()))this.scene.projectiles.reflect(q)}}gravefall(p){for(const b of this.scene.breakables){if(b.sprite.active&&Math.abs(b.sprite.x-p.x)<48&&p.y<b.sprite.y+45)b.hit(2)}this.scene.particles.burst(p.x,p.y+25,'DEBRIS',15)} }
class LevelGenerator{constructor(s){this.scene=s}build(){const s=this.scene;const addGround=(x,y,w,h=32)=>{const g=s.physics.add.image(x,y,'tile').setImmovable(true).setDisplaySize(w,h);g.body.allowGravity=false;s.ground.push(g);return g};addGround(320,600,640);addGround(900,600,420);addGround(1400,600,700);addGround(2250,600,700);addGround(3100,600,700);addGround(3950,600,900);for(let i=0;i<5;i++)new BreakableTile(s,1120+i*64,584);for(let i=0;i<4;i++)new BreakableTile(s,1780+i*64,584);for(let i=0;i<5;i++)new BreakableTile(s,2670+i*64,584);new Guard(s,650,540);new Archer(s,1050,540);new Guard(s,1500,540);new Brute(s,2050,520);new Archer(s,2450,540);new Guard(s,2900,540);new Brute(s,3400,520);new Archer(s,3750,540);new Guard(s,4300,540);const spike=(x,w)=>{const z={x,w,y:600};s.spikeZones.push(z);s.add.image(x+w/2,588,'spike').setDisplaySize(w,24).setDepth(8)};spike(2050,100);spike(3050,120);spike(3700,120);s.add.text(4560,535,'THE END',{fontFamily:'monospace',fontSize:'28px',color:'#b5363b'}).setDepth(10);s.endX=4620}}
class ComboSystem{constructor(s){this.scene=s;this.count=0;this.max=0;this.kills=0;this.timer=0}addHit(){this.count++;this.max=Math.max(this.max,this.count);this.timer=1800;if(this.scene.hud)this.scene.hud.flashCombo()}addKill(){this.kills++;this.addHit()}update(dt){if(this.timer>0){this.timer-=dt;if(this.timer<=0)this.count=0}}}
class HUD{constructor(s){this.scene=s;this.root=s.add.container(0,0).setDepth(950).setScrollFactor(0);this.texts={};const t=s.add.text;this.texts.hp=t(28,24,'HP  ■■■■■',{fontFamily:'monospace',fontSize:'18px',color:'#d94a4d'});this.texts.dash=t(28,50,'DASH  ◆ READY',{fontFamily:'monospace',fontSize:'15px',color:'#b5363b'});this.texts.combo=t(W-28,24,'COMBO x0',{fontFamily:'monospace',fontSize:'25px',color:'#ddd7ca',fontStyle:'bold'}).setOrigin(1,0);this.texts.kills=t(W-28,57,'KILLS 0',{fontFamily:'monospace',fontSize:'14px',color:'#b8b3a8'}).setOrigin(1,0);this.texts.time=t(W/2,22,'00.00',{fontFamily:'monospace',fontSize:'17px',color:'#b8b3a8'}).setOrigin(.5,0);Object.values(this.texts).forEach(x=>this.root.add(x));this.pulse=0}update(){const p=this.scene.player;if(!p)return;let hp='';for(let i=0;i<p.maxHp;i++)hp+=i<p.hp?'■':'□';this.texts.hp.setText('HP  '+hp);this.texts.dash.setText('DASH  '+(p.dashAvailable?'◆ READY':'◇ EMPTY'));this.texts.dash.setColor(p.dashAvailable?'#d94a4d':'#747783');this.texts.combo.setText('COMBO x'+this.scene.combo.count);this.texts.kills.setText('KILLS '+this.scene.combo.kills);this.texts.time.setText(this.scene.formatTime(this.scene.runTime));if(this.pulse>0){this.pulse-=16;this.texts.dash.setScale(1+Math.sin(this.pulse*.04)*.12)}}flashCombo(){this.texts.combo.setScale(1.22);this.scene.tweens.add({targets:this.texts.combo,scale:1,duration:170})}hide(v=true){this.root.setVisible(!v)}}
class MainScene extends Phaser.Scene{constructor(){super('GameScene')}create(){this.mobile=this.sys.game.device.input.touch;this.gameState=new GameStateManager(this);this.soundSystem=new SoundSystem();this.particles=new ParticleManager(this);this.juice=new JuiceManager(this);this.inputManager=new InputManager(this);this.combo=new ComboSystem(this);this.combat=new CombatSystem(this);this.projectiles=new ProjectileManager(this);this.enemies=[];this.breakables=[];this.spikeZones=[];this.ground=[];this.runTime=0;this.debug=false;this.touchGraphics=this.add.graphics();PixelFactory.make(this);this.createMenu();this.scale.on('resize',()=>this.handleResize());this.input.keyboard.on('keydown-F3',()=>this.debug=!this.debug);this.input.keyboard.on('keydown-ESC',()=>this.togglePause());this.input.keyboard.on('keydown-R',()=>{if(this.gameState.is('DEAD')||this.gameState.is('VICTORY'))this.restartGame()})}createMenu(){this.menu=this.add.container(0,0).setDepth(1000);const bg=this.add.rectangle(W/2,H/2,W,H,0x0d1118).setScrollFactor(0),moon=this.add.circle(W*.78,H*.28,100,0x202936,.65).setStrokeStyle(3,0x454c58,.5),title=this.add.text(W/2,H*.27,'BLOODBOUND',{fontFamily:'monospace',fontSize:'70px',fontStyle:'bold',color:'#ddd7ca',stroke:'#0a0c10',strokeThickness:8}).setOrigin(.5),sub=this.add.text(W/2,H*.37,'FAST.  BRUTAL.  RELENTLESS.',{fontFamily:'monospace',fontSize:'18px',fontStyle:'bold',color:'#b5363b'}).setOrigin(.5),play=this.add.text(W/2,H*.52,'[ PLAY ]',{fontFamily:'monospace',fontSize:'34px',fontStyle:'bold',color:'#ddd7ca',backgroundColor:'#202936',padding:{left:28,right:28,top:12,bottom:12}}).setOrigin(.5).setInteractive({useHandCursor:true}),controls=this.add.text(W/2,H*.65,'WASD / ARROWS  MOVE     SPACE  JUMP\nJ  ATTACK     K  PARRY     L  BLOOD DASH\nS + J  GRAVEFALL     ESC  PAUSE',{fontFamily:'monospace',fontSize:'15px',align:'center',color:'#747783',lineSpacing:8}).setOrigin(.5);this.menu.add([bg,moon,title,sub,play,controls]);play.on('pointerdown',()=>{this.soundSystem.click();this.startGame()})}startGame(){this.menu.setVisible(false);this.gameState.set('PLAYING');this.newWorld()}newWorld(){this.particles.clear();this.projectiles.clear();this.enemies=[];this.breakables=[];this.ground=[];this.spikeZones=[];this.cameras.main.setScroll(0,0);this.physics.world.gravity.y=900;this.player=new Player(this,130,540);this.level=new LevelGenerator(this);this.level.build();for(const g of this.ground)this.physics.add.collider(this.player,g);for(const b of this.breakables)this.physics.add.collider(this.player,b.sprite);for(const e of this.enemies)this.physics.add.collider(e,this.ground);this.hud=new HUD(this);this.runTime=0;this.combo=new ComboSystem(this);this.gameState.state='PLAYING';this.cameras.main.startFollow(this.player,true,.1,.1);this.cameras.main.setDeadzone(380,210);this.cameras.main.setFollowOffset(100,0);this.cameras.main.setBounds(0,0,5000,1800);this.cameras.main.setBackgroundColor(PAL.bg);this.inputManager.configureTouch();this.rebuildTouchUI();this.showToast('MOVE  •  JUMP  •  ATTACK',1500)}rebuildTouchUI(){this.children.list.filter(o=>o.name&&o.name.startsWith('touchLabel_')).forEach(o=>o.destroy());this.inputManager.configureTouch();this.inputManager.drawTouch(this.touchGraphics);this.inputManager.refreshTouchLabels()}spawnEnemy(e){this.enemies.push(e)}update(time,delta){if(!this.gameState.is('PLAYING')){if(this.gameState.is('DEAD')||this.gameState.is('VICTORY'))this.updateOverlayInput();return}if(this.juice.update(delta))return;this.runTime+=delta;this.combo.update(delta);this.projectiles.update(delta);for(const e of this.enemies)e.update(delta);this.checkSpikes();this.particles.update(delta);if(this.hud)this.hud.update();this.updateLookAhead();this.updateTouchGraphics();if(this.player&&this.player.x>this.level.scene.endX)this.victory()}updateLookAhead(){if(this.player)this.cameras.main.setFollowOffset(100+this.player.facing*75,0)}checkSpikes(){const p=this.player;if(!p||p.state==='DEAD')return;for(const z of this.spikeZones)if(p.x>z.x&&p.x<z.x+z.w&&p.y>z.y-30&&p.y<z.y+35){p.takeDamage(3,{x:p.x,y:p.y},{x:-p.facing*250,y:-420});break}if(p.y>1740)p.takeDamage(99,{x:p.x,y:p.y},{x:0,y:-400})}handleGameState(state){if(this.hud)this.hud.hide(state!=='PLAYING');if(state==='PAUSED')this.showPause()}togglePause(){if(this.gameState.is('PLAYING')){this.gameState.set('PAUSED');this.showPause()}else if(this.gameState.is('PAUSED')){this.pauseOverlay?.destroy();this.gameState.set('PLAYING')}}showPause(){if(this.pauseOverlay)this.pauseOverlay.destroy();this.pauseOverlay=this.add.container(0,0).setDepth(1100).setScrollFactor(0);const r=this.add.rectangle(W/2,H/2,W,H,0x0d1118,.82),t=this.add.text(W/2,H*.4,'PAUSED',{fontFamily:'monospace',fontSize:'52px',fontStyle:'bold',color:'#ddd7ca'}).setOrigin(.5),s=this.add.text(W/2,H*.52,'ESC / TAP TO RESUME',{fontFamily:'monospace',fontSize:'17px',color:'#b5363b'}).setOrigin(.5);this.pauseOverlay.add([r,t,s]);this.pauseOverlay.setInteractive(new Phaser.Geom.Rectangle(0,0,W,H),Phaser.Geom.Rectangle.Contains);this.pauseOverlay.on('pointerdown',()=>this.togglePause())}updateOverlayInput(){if(this.inputManager.pressed('jump')||this.inputManager.pressed('attack'))this.restartGame()}showDeath(){if(this.gameState.is('DEAD'))return;this.gameState.set('DEAD');this.overlay('YOU DIED','Tap / Press JUMP to restart')}victory(){if(this.gameState.is('VICTORY'))return;this.gameState.set('VICTORY');this.juice.flash(0xddd7ca,.18,600);this.juice.shakeCamera(.01,220);this.overlay('CASTLE CLEARED',`TIME  ${this.formatTime(this.runTime)}     KILLS  ${this.combo.kills}     MAX COMBO  ${this.combo.max}`)}overlay(title,sub){if(this.overlayRoot)this.overlayRoot.destroy();this.overlayRoot=this.add.container(0,0).setDepth(1050).setScrollFactor(0);const r=this.add.rectangle(W/2,H/2,W,H,0x0d1118,.86),t=this.add.text(W/2,H*.39,title,{fontFamily:'monospace',fontSize:'54px',fontStyle:'bold',color:'#ddd7ca',stroke:'#0a0c10',strokeThickness:6}).setOrigin(.5),s=this.add.text(W/2,H*.51,sub,{fontFamily:'monospace',fontSize:'17px',color:'#b8b3a8',align:'center'}).setOrigin(.5),b=this.add.text(W/2,H*.64,'[ RESTART ]',{fontFamily:'monospace',fontSize:'27px',fontStyle:'bold',color:'#d94a4d',backgroundColor:'#202936',padding:{left:25,right:25,top:10,bottom:10}}).setOrigin(.5).setInteractive();b.on('pointerdown',()=>this.restartGame());this.overlayRoot.add([r,t,s,b])}restartGame(){this.scene.restart()}showToast(text,duration){const t=this.add.text(W/2,H*.18,text,{fontFamily:'monospace',fontSize:'15px',fontStyle:'bold',color:'#ddd7ca',backgroundColor:'#202936',padding:{left:15,right:15,top:8,bottom:8}}).setOrigin(.5).setScrollFactor(0).setDepth(950);this.tweens.add({targets:t,alpha:0,delay:duration,duration:300,onComplete:()=>t.destroy()})}formatTime(ms){const s=ms/1000;return`${String(Math.floor(s/60)).padStart(2,'0')}.${String(Math.floor(s%60)).padStart(2,'0')}`}handleResize(){if(this.inputManager&&this.mobile)this.rebuildTouchUI()}updateTouchGraphics(){if(this.mobile){this.touchGraphics.clear();this.inputManager.drawTouch(this.touchGraphics)}}}
const config={type:Phaser.CANVAS,width:W,height:H,parent:'game',backgroundColor:PAL.bg,render:{pixelArt:true,antialias:false,roundPixels:true},physics:{default:'arcade',arcade:{gravity:{y:900},debug:false,fps:60}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:W,height:H},scene:[MainScene],input:{activePointers:6},callbacks:{postBoot:game=>game.canvas.setAttribute('aria-label','BLOODBOUND game canvas')}};
new Phaser.Game(config);
