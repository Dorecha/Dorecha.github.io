<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>BLOODBOUND</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1118;color:#ddd7ca;font-family:monospace}#status{height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}</style></head><body><div id="status">LOADING BLOODBOUND...</div><script>
(async()=>{
 const status=document.getElementById('status');
 const source='https://raw.githubusercontent.com/Dorecha/Dorecha.github.io/0ab6c2fe1b743395f7884b774aece45fe4a9e593/bloodbound/index.html';
 try{
  const r=await fetch(source,{cache:'no-store'}); if(!r.ok) throw new Error('Payload fetch HTTP '+r.status);
  const html=await r.text();
  const m=html.match(/const DATA="([^"]+)"/); if(!m) throw new Error('Payload DATA not found');
  let b64=m[1].replace(/[^A-Za-z0-9+/=_-]/g,'').replace(/-/g,'+').replace(/_/g,'/');
  b64=b64.replace(/=+$/,''); b64+='='.repeat((4-b64.length%4)%4);
  let raw;
  try{raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));}
  catch(e){throw new Error('Payload base64 is corrupted: '+e.message)}
  if(!('DecompressionStream'in window)) throw new Error('Browser lacks DecompressionStream');
  const ds=new DecompressionStream('gzip');
  const text=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();
  if(!text.includes('new Phaser.Game')) throw new Error('Payload decompressed, but game HTML is incomplete');
  document.open();document.write(text);document.close();
 }catch(e){status.textContent='BLOODBOUND FAILED TO BOOT: '+e.message;console.error(e)}
})();
</script></body></html>
